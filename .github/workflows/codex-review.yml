name: Codex PR review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: number

concurrency:
  group: codex-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      vars.AI_COLLAB_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        !github.event.pull_request.draft &&
        contains(github.event.pull_request.labels.*.name, 'needs-review')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      feedback: ${{ steps.codex.outputs.final-message }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number || inputs.pr_number }}/merge
          fetch-depth: 2
          persist-credentials: false
      - id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          sandbox: workspace-write
          allow-bots: true
          allow-bot-users: claude[bot]
          prompt: |
            Review the changes in Winter Rush PR #${{ github.event.pull_request.number || inputs.pr_number }}.
            Compare the merge commit's parents with git diff HEAD^1 HEAD^2.
            Find concrete bugs, regressions, and missing checks in the changed code.
            Focus on mobile input, game economy, save/load, and player progression when relevant.
            Reply in concise Korean with file and line references. If no issue is found, say so briefly.

  comment:
    needs: review
    if: needs.review.outputs.feedback != ''
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        env:
          CODEX_FEEDBACK: ${{ needs.review.outputs.feedback }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request?.number ?? Number(context.payload.inputs.pr_number),
              body: process.env.CODEX_FEEDBACK,
            });
